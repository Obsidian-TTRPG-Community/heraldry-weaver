name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write       # create the release
  id-token: write       # required for attestation
  attestations: write   # write the provenance attestation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Pull this version's section out of CHANGELOG.md for the release notes:
          # everything between "## [<tag>]" and the next "## [" / reference-link block.
          awk -v ver="$tag" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && (/^## \[/ || /^\[[0-9]/) { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          # Trim leading blank lines; fall back to a generic note if not found.
          sed -i '/./,$!d' release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Heraldry Weaver $tag" > release-notes.md
          fi
          gh release create "$tag" \
            --title="$tag" \
            --notes-file release-notes.md \
            main.js manifest.json styles.css versions.json
